name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            xvfb dbus-x11 zenity

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Build (release)
        run: cargo build --locked --release

      - name: Rust tests
        run: cargo test --locked

      - name: UI consistency checks
        shell: bash
        run: node scripts/check-ui.js

      # Loads the real page in the platform webview and waits for the frontend
      # to answer over IPC (`--smoke-test` exits 0 on success, 1 on timeout).
      - name: Smoke test (Linux, headless)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a dbus-run-session -- env \
            WEBKIT_DISABLE_COMPOSITING_MODE=1 \
            LIBGL_ALWAYS_SOFTWARE=1 \
            ./target/release/inkwell --smoke-test

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./target/release/inkwell --smoke-test

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/inkwell.exe --smoke-test
