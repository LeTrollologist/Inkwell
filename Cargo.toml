[package]
name = "inkwell"
version = "0.1.1"
description = "A sleek Markdown viewer with a BYOK LLM copilot"
authors = ["Inkwell"]
edition = "2021"
rust-version = "1.88"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
dirs = "6"
raw-window-handle = "0.6"
keyring = "4"
base64 = "0.22"
percent-encoding = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Keep build scripts/proc-macros lean; large debug host binaries are needlessly
# slow to link and this project has no need for their debug info.
[profile.dev.build-override]
opt-level = 1
debug = false

[profile.release.build-override]
opt-level = 1
debug = false
